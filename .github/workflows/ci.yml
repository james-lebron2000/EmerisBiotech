name: Test workbench and Predome

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench:
    name: Existing workbench (macOS sandbox)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install existing locked environment
        run: uv sync --extra dev --frozen
      - name: Preserve full workbench regression
        run: uv run pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patient showcase with real HTTP and isolated state
        run: |
          npm install --prefix "$RUNNER_TEMP/patient-lab-ui" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/patient-lab-ui/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_patient_lab.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_patient_public.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_molecule_public.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_cohort_public.cjs

  predome:
    name: Predome public source and browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/predome
    env:
      EMERIS_MODE: local
      EMERIS_ENABLE_USER_LLM: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-research-v4.txt
      - name: Test without frozen evidence or runtime databases
        run: python scripts/test_source.py
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check fully intercepted input and analytics interfaces
        run: |
          node tests/ui_predict_context.cjs
          node tests/ui_prospective_coverage.cjs
