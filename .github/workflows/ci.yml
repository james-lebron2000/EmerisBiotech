name: Test workbench and Predome

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench:
    name: Existing workbench (macOS sandbox)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install existing locked environment
        run: uv sync --extra dev --frozen
      - name: Preserve full workbench regression
        run: uv run pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patient showcase with real HTTP and isolated state
        run: |
          npm install --prefix "$RUNNER_TEMP/patient-lab-ui" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/patient-lab-ui/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_patient_lab.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/patient-lab-ui/node_modules/playwright" node tests/ui_patient_public.cjs

  predome:
    name: Predome public source and browser fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/predome
    env:
      EMERIS_MODE: local
      EMERIS_ENABLE_USER_LLM: 'false'
      EMERIS_ENABLE_ARENA_LLM: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-research-v4.txt
      - name: Check syntax, runtime import boundaries and source fixtures
        run: python scripts/check.py
      - name: Install browser test runtime
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=2 playwright@1.56.1
          sudo python3 - <<'PY'
          from pathlib import Path
          settings=Path('/etc/apt/apt.conf.d/99-predome-network-bounds')
          settings.write_text('Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n')
          # The prior run spent its 20-minute limit on the Azure HTTP mirror.
          # Keep Ubuntu signatures/TLS verification and use official HTTPS mirrors.
          for source in [Path('/etc/apt/apt-mirrors.txt'),Path('/etc/apt/sources.list'),*Path('/etc/apt/sources.list.d').glob('*.sources')]:
              if source.is_file():
                  original=source.read_text()
                  updated=original.replace('http://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('http://archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu').replace('http://security.ubuntu.com/ubuntu','https://security.ubuntu.com/ubuntu')
                  if updated!=original:source.write_text(updated)
          PY
          npx playwright install --with-deps chromium
      - name: Check controlled offline interfaces and loopback download transport
        run: python scripts/check.py --suite static --browser
